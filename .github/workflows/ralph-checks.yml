name: Ralph checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  controller:
    name: Ralph checks (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Controller behavior
        shell: bash
        run: |
          bash ralph/tests/test-shell.sh
          bash ralph/test-codex-render.sh
