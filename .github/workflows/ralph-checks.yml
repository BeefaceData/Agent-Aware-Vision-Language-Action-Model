name: Ralph checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  controller:
    name: Ralph checks (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Controller behavior
        run: python -m unittest discover -s ralph/tests -v
      - name: Bash syntax
        shell: bash
        run: |
          for script in ralph/*.sh; do bash -n "$script"; done
