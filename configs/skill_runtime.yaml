# Development acquisition recipe; these limits are not validated operating ranges.
max_turns: 20
perception:
  rgbd_enabled: false
recipe:
  arm: left
  max_retries: 2
  stage:
    target: mug_pregrasp
  retreat:
    target: current_ee
    path_mode: reverse_approach
    retreat_distance_m: 0.065
    orientation_mode: preserve_current
  vla:
    max_chunks: 3
    chunk_size: 8
    max_policy_actions: 24
budget:
  max_skill_calls: 20
  max_analytic_ticks: 12000
  max_policy_actions: 72
  max_vla_chunks: 9
