# Fresh-reset integration check through verified left placement and scene clear.
# This stops before the right-arm rack-hanging phase.
record_video: true
max_turns: 8
stop_after_left_transfer: true
recipe:
  stage_before_first_vla: false
  arm: left
  max_retries: 0
  vla:
    max_chunks: 32
    chunk_size: 8
    max_policy_actions: 256
handoff:
  max_chunks: 32
  chunk_size: 8
  max_policy_actions: 256
budget:
  max_skill_calls: 6
  max_analytic_ticks: 1000
  max_policy_actions: 512
  max_vla_chunks: 64
