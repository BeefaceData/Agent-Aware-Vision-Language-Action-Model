# Development full-task Opus orchestration. The local simulator runs on this
# machine; frozen Neotix policy chunks continue to be served through Modal.
record_video: true
max_turns: 100
perception:
  rgbd_enabled: false
recipe:
  arm: left
  max_retries: 2
  vla:
    max_chunks: 32
    chunk_size: 8
    max_policy_actions: 768
budget:
  max_skill_calls: 100
  max_analytic_ticks: 2500
  max_policy_actions: 800
  max_vla_chunks: 100
anthropic:
  model: claude-opus-5
  task_scope: full_task
  max_tokens: 4096
  timeout_seconds: 45.0
  max_calls: 100
  planner_feedback_chunks: 1
  # Historical phase durations: delay first check, then use one 8-action chunk.
  grasp_initial_feedback_after_actions: 64
  handoff_initial_feedback_after_actions: 128
  hang_initial_feedback_after_actions: 64
  vla:
    max_chunks: 32
    chunk_size: 8
    max_policy_actions: 768
