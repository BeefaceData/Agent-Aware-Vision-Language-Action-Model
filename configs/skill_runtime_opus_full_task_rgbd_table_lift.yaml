# One recorded exploratory episode with cached table-plane mug-lift evidence.
# The base RGB-D full-task configuration remains available unchanged.
record_video: true
max_turns: 100
perception:
  rgbd_enabled: true
  opus_rack_grounding: true
  opus_mug_lift_grounding: true
  rack_grounding_camera: right_camera
  rack_prompt_profile: explore_mug_rack
recipe:
  arm: left
  max_retries: 2
  vla:
    max_chunks: 32
    chunk_size: 8
    max_policy_actions: 768
budget:
  max_skill_calls: 100
  max_analytic_ticks: 2500
  max_policy_actions: 800
  max_vla_chunks: 100
anthropic:
  model: claude-opus-5
  task_scope: full_task
  max_tokens: 4096
  timeout_seconds: 45.0
  max_calls: 100
  # VLA-first right pickup and rack approach, with feedback after each chunk.
  planner_feedback_chunks: 1
  vla:
    max_chunks: 32
    chunk_size: 8
    max_policy_actions: 768
