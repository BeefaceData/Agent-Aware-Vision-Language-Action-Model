# High-budget Opus exploration episode for RGB-D grounded recovery.
# Opus receives a fresh planner turn after each VLA chunk (up to 100 attempts).
record_video: true
perception:
  rgbd_enabled: true
max_turns: 100
recipe:
  arm: left
  max_retries: 2
  stage:
    target: mug_pregrasp
  retreat:
    target: current_ee
    offset_xyz: [0.0, 0.0, 0.05]
  vla:
    max_chunks: 32
    chunk_size: 8
    max_policy_actions: 768
budget:
  max_skill_calls: 100
  max_analytic_ticks: 2500
  max_policy_actions: 800
  max_vla_chunks: 100
anthropic:
  model: claude-opus-5
  max_tokens: 2048
  timeout_seconds: 45.0
  max_calls: 100
  planner_feedback_chunks: 1
  vla:
    max_chunks: 32
    chunk_size: 8
    max_policy_actions: 768
