# Full-task public-perception replay focused on right-arm pickup recovery.
# Stop once the public right-arm lift predicate confirms the retry outcome.
record_video: true
render_once_per_step: true
max_turns: 100
perception:
  rgbd_enabled: true
  perception_camera: default
  opus_rack_grounding: true
  opus_mug_lift_grounding: false
  mug_lift_first_check_after_actions: 0
  rack_grounding_camera: perception_camera
  rack_prompt_profile: explore_mug_rack
recipe:
  arm: right
  max_retries: 2
  vla:
    max_chunks: 32
    chunk_size: 16
    max_policy_actions: 768
budget:
  max_skill_calls: 100
  max_analytic_ticks: 4000
  max_policy_actions: 800
  max_vla_chunks: 100
anthropic:
  model: claude-opus-5
  task_scope: full_task
  max_tokens: 4096
  timeout_seconds: 45.0
  max_calls: 100
  planner_feedback_chunks: 1
  grasp_initial_feedback_after_actions: 0
  handoff_initial_feedback_after_actions: 0
  hang_initial_feedback_after_actions: 0
  vla:
    max_chunks: 32
    chunk_size: 16
    max_policy_actions: 768
stop_after_right_pickup: true
