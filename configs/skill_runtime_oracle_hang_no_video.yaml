# Isolates analytic execution from periodic frame rendering during a replay test.
record_video: false
max_turns: 3
recipe:
  arm: right
  max_retries: 2
  stage_before_first_vla: false
  vla:
    max_chunks: 1
    chunk_size: 16
    max_policy_actions: 16
handoff:
  max_chunks: 1
  chunk_size: 16
  max_policy_actions: 16
budget:
  max_skill_calls: 8
  max_analytic_ticks: 5000
  max_policy_actions: 1200
  max_vla_chunks: 100
stop_after_right_pickup: true
