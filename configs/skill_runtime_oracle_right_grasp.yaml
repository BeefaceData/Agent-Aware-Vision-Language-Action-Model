# Development-only: replay the left-transfer boundary, then run the right
# grasp under oracle gates so a failed attempt can enter its recovery sequence.
record_video: true
max_turns: 16
recipe:
  arm: right
  max_retries: 2
  stage_before_first_vla: false
  vla:
    max_chunks: 3
    chunk_size: 16
    max_policy_actions: 48
handoff:
  max_chunks: 8
  chunk_size: 16
  max_policy_actions: 128
budget:
  max_skill_calls: 16
  max_analytic_ticks: 5000
  max_policy_actions: 1200
  max_vla_chunks: 100
stop_after_right_pickup: true
